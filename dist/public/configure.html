<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvio Live Sports | Premium Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(28, 28, 30, 0.4);
      --card-border: rgba(255, 255, 255, 0.05);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.3);
      --glass: rgba(255, 255, 255, 0.02);
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(239, 68, 68, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.05), transparent 25%);
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 20px; border-radius: 16px; }
      h1 { font-size: 24px; }
      .sports-grid { grid-template-columns: 1fr !important; }
      .footer-actions { flex-direction: column; }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      margin: 0 0 10px 0;
      font-size: 32px;
      background: linear-gradient(135deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px var(--accent-glow);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.3);
      }
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin: 0;
    }

    .section {
      background: var(--glass);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .sports-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .checkbox-label:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .checkbox-label.active {
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
    }

    input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #555;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .input-group {
      margin-top: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
      transition: all 0.3s;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
    }

    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="/logo.png" alt="Nuvio Live Sports" style="width: 88px; height: 88px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4); border: 2px solid rgba(255, 255, 255, 0.15); object-fit: cover;">
      <h1><span class="dot"></span> Nuvio Sports</h1>
      <p class="subtitle">Customize your ultimate live sports dashboard.</p>
    </div>

    <div class="section">
      <h3>Select Sports</h3>
      <div class="sports-grid" id="sportsGrid">
        <label class="checkbox-label active"><input type="checkbox" value="football" checked> ⚽ Football</label>
        <label class="checkbox-label active"><input type="checkbox" value="basketball" checked> 🏀 Basketball</label>
        <label class="checkbox-label active"><input type="checkbox" value="cricket" checked> 🏏 Cricket</label>
        <label class="checkbox-label active"><input type="checkbox" value="american_football" checked> 🏈 NFL</label>
        <label class="checkbox-label active"><input type="checkbox" value="motorsport" checked> 🏎️ Racing</label>
        <label class="checkbox-label active"><input type="checkbox" value="hockey" checked> 🏒 Hockey</label>
        <label class="checkbox-label active"><input type="checkbox" value="baseball" checked> ⚾ Baseball</label>
        <label class="checkbox-label active"><input type="checkbox" value="rugby" checked> 🏉 Rugby</label>
        <label class="checkbox-label active"><input type="checkbox" value="college" checked> 🎓 College</label>
        <label class="checkbox-label active"><input type="checkbox" value="mma" checked> 🥊 MMA</label>
        <label class="checkbox-label active"><input type="checkbox" value="golf" checked> ⛳ Golf</label>
        <label class="checkbox-label active"><input type="checkbox" value="tennis" checked> 🎾 Tennis</label>
        <label class="checkbox-label active"><input type="checkbox" value="darts" checked> 🎯 Darts</label>
        <label class="checkbox-label active"><input type="checkbox" value="other" checked> 📡 Other Sports</label>
      </div>
    </div>

    <div class="section">
      <h3>Localization</h3>
      <div class="input-group">
        <label>Select your local timezone (Match times will be displayed in this timezone)</label>
        <select id="timezone" style="width: 100%; padding: 14px 16px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--card-border); border-radius: 12px; color: #fff; font-size: 15px; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s; outline: none; cursor: pointer;">
        </select>
      </div>
    </div>

    <div class="section">
      <h3>Priority Tracking</h3>
      <div class="input-group">
        <label>Favorite Teams (Comma Separated)</label>
        <input type="text" id="teams" placeholder="e.g. Arsenal, Lakers, Ferrari">
      </div>
    </div>

    <div class="section">
      <h3>Streaming Sources</h3>
      <div class="sports-grid" id="sourcesGrid">
        <label class="checkbox-label active"><input type="checkbox" value="streamfree" checked> 🌐 StreamFree</label>
        <label class="checkbox-label active"><input type="checkbox" value="timstreams" checked> 📺 TimStreams</label>
        <label class="checkbox-label active"><input type="checkbox" value="streamedpk" checked> 📺 Streamed.pk</label>
        <label class="checkbox-label active"><input type="checkbox" value="sportyhunter" checked> 📺 SportyHunter</label>
        <label class="checkbox-label active"><input type="checkbox" value="watchfooty" checked> 📺 WatchFooty</label>
        <label class="checkbox-label active"><input type="checkbox" value="cdnlive" checked> 📺 CDNLiveTV</label>
        <label class="checkbox-label active"><input type="checkbox" value="streamsports99" checked> 📺 StreamSports99</label>
        <label class="checkbox-label active"><input type="checkbox" value="streamic" checked> 🌐 Streamic</label>
      </div>
    </div>

    <a href="#" id="installBtn" class="btn">INSTALL ADDON</a>
    <button id="copyBtn" class="btn" style="background: #333; margin-top: 12px; font-size: 14px;">COPY LINK (FOR NUVIO APP)</button>

    <div style="margin-top: 25px; padding: 16px; background: rgba(255, 95, 95, 0.08); border: 1px solid rgba(255, 95, 95, 0.2); border-radius: 16px; text-align: center;">
      <p style="margin: 0 0 10px 0; font-size: 13px; color: var(--text-muted); line-height: 1.5;">
        ☕ <strong>Support Nuvio Live Sports</strong><br>Help keep our servers, scrapers, and 24/7 sports streams online!
      </p>
      <div class="footer-actions" style="display: flex; gap: 10px; justify-content: center; align-items: center;">
        <a href="https://ko-fi.com/rajodedara" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #FF5E5B; color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px rgba(255, 94, 91, 0.3); transition: transform 0.2s; width: 100%;">
          <svg height="18" viewBox="0 0 24 24" width="18" fill="currentColor"><path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.966-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.966 1.909.822 1.838 3.197.723 4.314z"/></svg>
          Support on Ko-fi
        </a>
        <a href="https://github.com/rajhodedara/live-sport-plugin" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 14px; transition: transform 0.2s; width: 100%;">
          <svg height="18" viewBox="0 0 16 16" width="18" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
          GitHub
        </a>
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('installBtn');
    const copyBtn = document.getElementById('copyBtn');
    const input = document.getElementById('teams');
    const checkboxes = document.querySelectorAll('#sportsGrid input[type="checkbox"]');
    const sourceCheckboxes = document.querySelectorAll('#sourcesGrid input[type="checkbox"]');
    const timezoneSelect = document.getElementById('timezone');

    // Attempt to load existing config from URL
    let existingConfig = {};
    try {
      const pathParts = window.location.pathname.split('/');
      if (pathParts.length >= 3 && pathParts[pathParts.length - 1] === 'configure') {
        const encoded = pathParts[pathParts.length - 2];
        let base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        existingConfig = JSON.parse(decodeURIComponent(escape(atob(base64))));
      }
    } catch (e) {
      console.warn("Could not parse existing config from URL", e);
    }

    // Populate timezones
    try {
      const popularTimezones = [
        { value: 'Pacific/Midway', label: 'Midway Island (GMT-11:00)' },
        { value: 'Pacific/Honolulu', label: 'Hawaii (GMT-10:00)' },
        { value: 'America/Anchorage', label: 'Alaska (GMT-09:00)' },
        { value: 'America/Los_Angeles', label: 'Pacific Time (GMT-08:00)' },
        { value: 'America/Denver', label: 'Mountain Time (GMT-07:00)' },
        { value: 'America/Chicago', label: 'Central Time (GMT-06:00)' },
        { value: 'America/New_York', label: 'Eastern Time (GMT-05:00)' },
        { value: 'America/Halifax', label: 'Atlantic Time (GMT-04:00)' },
        { value: 'America/Sao_Paulo', label: 'Brazil (GMT-03:00)' },
        { value: 'Atlantic/South_Georgia', label: 'Mid-Atlantic (GMT-02:00)' },
        { value: 'Atlantic/Azores', label: 'Azores (GMT-01:00)' },
        { value: 'Europe/London', label: 'UK & Ireland (GMT+00:00)' },
        { value: 'Europe/Paris', label: 'Western Europe (GMT+01:00)' },
        { value: 'Europe/Athens', label: 'Eastern Europe (GMT+02:00)' },
        { value: 'Europe/Moscow', label: 'Russia - Moscow (GMT+03:00)' },
        { value: 'Asia/Dubai', label: 'UAE (GMT+04:00)' },
        { value: 'Asia/Karachi', label: 'Pakistan (GMT+05:00)' },
        { value: 'Asia/Kolkata', label: 'India (GMT+05:30)' },
        { value: 'Asia/Dhaka', label: 'Bangladesh (GMT+06:00)' },
        { value: 'Asia/Bangkok', label: 'Thailand & Vietnam (GMT+07:00)' },
        { value: 'Asia/Singapore', label: 'Singapore & Malaysia (GMT+08:00)' },
        { value: 'Asia/Tokyo', label: 'Japan (GMT+09:00)' },
        { value: 'Australia/Sydney', label: 'Eastern Australia (GMT+10:00)' },
        { value: 'Pacific/Noumea', label: 'New Caledonia (GMT+11:00)' },
        { value: 'Pacific/Auckland', label: 'New Zealand (GMT+12:00)' }
      ];

      const localTz = existingConfig.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
      let matchedLocal = false;

      popularTimezones.forEach(tz => {
        const option = document.createElement('option');
        option.value = tz.value;
        option.textContent = tz.label;
        option.style.background = '#1c1c1e';
        option.style.color = '#fff';
        if (tz.value === localTz) {
          option.selected = true;
          matchedLocal = true;
        }
        timezoneSelect.appendChild(option);
      });

      if (!matchedLocal && localTz) {
        const option = document.createElement('option');
        option.value = localTz;
        const date = new Date();
        const offset = -date.getTimezoneOffset();
        const sign = offset >= 0 ? '+' : '-';
        const hours = Math.floor(Math.abs(offset) / 60).toString().padStart(2, '0');
        const mins = (Math.abs(offset) % 60).toString().padStart(2, '0');
        const loc = localTz.split('/').pop().replace(/_/g, ' ');
        option.textContent = `${loc} (GMT${sign}${hours}:${mins})`;
        option.style.background = '#1c1c1e';
        option.style.color = '#fff';
        option.selected = true;
        timezoneSelect.insertBefore(option, timezoneSelect.firstChild);
      }
    } catch(e) {
      console.warn("Timezone API not fully supported.", e);
    }

    // Apply existing config settings to UI
    if (existingConfig.teams) {
      input.value = existingConfig.teams;
    }
    
    if (existingConfig.sports) {
      if (existingConfig.sports === 'none') {
        checkboxes.forEach(cb => { cb.checked = false; cb.closest('.checkbox-label').classList.remove('active'); });
      } else if (existingConfig.sports !== 'all') {
        const sports = existingConfig.sports.split(',');
        checkboxes.forEach(cb => {
          cb.checked = sports.includes(cb.value);
          if (cb.checked) cb.closest('.checkbox-label').classList.add('active');
          else cb.closest('.checkbox-label').classList.remove('active');
        });
      }
    }

    if (existingConfig.sources) {
      if (existingConfig.sources === 'none') {
        sourceCheckboxes.forEach(cb => { cb.checked = false; cb.closest('.checkbox-label').classList.remove('active'); });
      } else if (existingConfig.sources !== 'all') {
        const sources = existingConfig.sources.split(',');
        sourceCheckboxes.forEach(cb => {
          cb.checked = sources.includes(cb.value);
          if (cb.checked) cb.closest('.checkbox-label').classList.add('active');
          else cb.closest('.checkbox-label').classList.remove('active');
        });
      }
    }

    let currentManifestUrl = '';

    function updateLink() {
      const teams = input.value.trim();
      const selectedSports = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
      const selectedSources = Array.from(sourceCheckboxes).filter(cb => cb.checked).map(cb => cb.value);
      const tz = timezoneSelect.value || Intl.DateTimeFormat().resolvedOptions().timeZone;

      let manifestUrl = window.location.origin + '/manifest.json';

      const config = {};
      if (teams) config.teams = teams;
      if (tz) config.timezone = tz;

      if (selectedSports.length < checkboxes.length) {
        config.sports = selectedSports.join(',');
        if (config.sports === '') config.sports = 'none';
      }

      if (selectedSources.length < sourceCheckboxes.length) {
        config.sources = selectedSources.join(',');
        if (config.sources === '') config.sources = 'none';
      }

      if (Object.keys(config).length > 0) {
        const base64Str = btoa(unescape(encodeURIComponent(JSON.stringify(config))));
        const encoded = base64Str.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        manifestUrl = window.location.origin + '/' + encoded + '/manifest.json';
      }

      currentManifestUrl = manifestUrl;
      const installUrl = manifestUrl.replace(/^https?:\/\//, 'stremio://');
      btn.href = installUrl;
    }

    copyBtn.addEventListener('click', (e) => {
      e.preventDefault();
      navigator.clipboard.writeText(currentManifestUrl).then(() => {
        const originalText = copyBtn.innerText;
        copyBtn.innerText = 'COPIED TO CLIPBOARD!';
        copyBtn.style.background = '#10b981';
        setTimeout(() => {
          copyBtn.innerText = originalText;
          copyBtn.style.background = '#333';
        }, 2000);
      });
    });

    input.addEventListener('input', updateLink);
    timezoneSelect.addEventListener('change', updateLink);
    [...checkboxes, ...sourceCheckboxes].forEach(cb => {
      cb.addEventListener('change', (e) => {
        const label = e.target.closest('.checkbox-label');
        if (e.target.checked) label.classList.add('active');
        else label.classList.remove('active');
        updateLink();
      });
    });
    
    updateLink();
  </script>
</body>

</html>
