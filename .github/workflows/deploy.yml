name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /root/nuvio-live-sports

            echo "==> Resetting any broken merge state..."
            git reset --hard HEAD

            LOCK_BEFORE="$(md5sum package-lock.json 2>/dev/null | awk '{print $1}')"

            echo "==> Pulling latest changes from main..."
            git pull origin main

            LOCK_AFTER="$(md5sum package-lock.json 2>/dev/null | awk '{print $1}')"

            # ── Zero-downtime rule ────────────────────────────────────────────
            # The app must keep serving during a deploy, so this workflow never
            # stops the cluster and never rewrites node_modules underneath it.
            #
            # Why that matters: impit is a native NAPI addon
            # (node_modules/impit-linux-x64-gnu/*.node) and ncc BUNDLES it, so
            # every worker maps it. `npm install` re-extracts those binaries; a
            # live worker faulting on a page whose backing file was replaced gets
            # SIGBUS and dies instantly, with no JS stack - which is why the
            # crashes never showed up in the app logs. Verified on this host:
            # every SIGBUS in ~/.pm2/pm2.log landed 40-50s after a push, during
            # npm install, and both workers died in the same second.
            #
            # So a normal deploy is: pull -> build -> rolling reload. Nothing is
            # killed; pm2 reload restarts workers one at a time, so the cluster
            # keeps answering requests throughout.
            #
            # A dependency change is the one case that genuinely needs install,
            # and it cannot be done safely under a live cluster. Rather than
            # silently risking SIGBUS kills, the deploy REFUSES and leaves the
            # running app untouched, printing the manual command to run.
            if [ "$LOCK_BEFORE" != "$LOCK_AFTER" ]; then
              echo ""
              echo "================================================================"
              echo "  DEPENDENCIES CHANGED - deploy paused on purpose"
              echo "================================================================"
              echo "  package-lock.json changed, so node_modules must be updated."
              echo "  That rewrites native modules which live workers have mapped,"
              echo "  and doing it under traffic SIGBUS-kills them."
              echo ""
              echo "  The running app was NOT touched. It is still serving the"
              echo "  previous code, with no downtime."
              echo ""
              echo "  Finish this deploy by hand (brief restart, done deliberately):"
              echo "    cd /root/nuvio-live-sports && pm2 stop nuvio-sports \\"
              echo "      && npm install --no-audit --no-fund && npm run build:local \\"
              echo "      && pm2 start ecosystem.config.js --update-env && pm2 save"
              echo "================================================================"
              echo ""
              exit 1
            fi

            echo "==> Dependencies unchanged - skipping npm install (nothing kills workers)."

            echo "==> Building distribution bundle (atomic staging to prevent SIGSEGV in live workers)..."
            rm -rf dist.next
            npx @vercel/ncc build src/index.js -o dist.next --minify -e sharp && npx -y copyfiles -f "src/providers/*.wasm" "src/providers/*.js" dist.next && node scripts/copy-guarded-worker-deps.js dist.next && npx -y copyfiles -u 2 "resolver/src/**/*" dist.next/src && node -e "require('fs').writeFileSync('dist.next/src/package.json', JSON.stringify({type:'module'},null,2))" && npx -y copyfiles -u 1 "public/**/*" dist.next/public && npx -y copyfiles -f "src/data/*.json" dist.next/data && npx -y copyfiles -f "src/data/*.json" dist.next/src/data

            echo "==> Verifying the staged artifact before it can reach the cluster..."
            node --check dist.next/index.js
            # Guard the invariant this deploy depends on: the bundle must resolve its
            # cache from MATCHES_CACHE_PATH at runtime. ncc rewrites the source's
            # path.join(process.cwd(), 'data') and drops the "data" segment, so if
            # this branch ever disappears the app silently reverts to writing inside
            # dist/ - the exact drift this deploy exists to remove.
            if ! grep -q 'MATCHES_CACHE_PATH' dist.next/index.js; then
              echo "ERROR: bundle has no MATCHES_CACHE_PATH branch - refusing to deploy"
              exit 1
            fi

            # A host with nothing at the configured path would boot an empty catalog
            # until the first sync. The bundle carries a copy (ncc traces data/), so
            # use it rather than starting blank. After the first sync this never runs.
            if [ ! -s data/matches_cache.json ]; then
              if [ -s dist.next/matches_cache.json ]; then
                cp -p dist.next/matches_cache.json data/matches_cache.json
                echo "    primed data/matches_cache.json from the bundle"
              else
                echo "    WARNING: no cache at data/ and none in the bundle - will boot empty until the first sync"
              fi
            fi

            echo "==> Swapping trees (rename only; running workers keep their inode)..."
            rm -rf dist.prev
            mv dist dist.prev 2>/dev/null || true
            mv dist.next dist

            echo "==> Reloading PM2 cluster with the ecosystem env (rolling)..."
            # --update-env is required, not cosmetic: without it pm2 reuses the env
            # stored in the process list, so an env block change deploys the new code
            # while the setting stays inert (which is how MATCHES_CACHE_PATH would
            # have shipped doing nothing). It also applies the file's 1500M ceiling.
            pm2 reload ecosystem.config.js --update-env
            rm -rf dist.prev 2>/dev/null || true

            echo "==> Deployment complete. Cluster stayed up throughout."
            echo "==> Health:"
            curl -s -o /dev/null -w '    manifest http=%{http_code} in %{time_total}s\n' http://127.0.0.1:7000/manifest.json || true
            echo "==> Worker restarts (should be unchanged from before this deploy):"
            pm2 jlist 2>/dev/null | tr ',' '\n' | grep -o '"restart_time":[0-9]*' | sed 's/.*://' | paste -sd' ' - || true
