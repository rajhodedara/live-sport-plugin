<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0c">
  <title>Nuvio Live Sports | Status</title>
  <script id="theme-init">try{var t=localStorage.getItem('nuvio-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet">

  <style>
    .layout { grid-template-columns: minmax(0, 1fr); }
    .page-head .head-tools { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .updated { color: var(--muted); font-size: 14px; }
    .btn-chip { min-height: 40px; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .state-msg { color: var(--muted); }
    .state-msg.is-error { color: var(--danger); }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: var(--space-4); margin-bottom: var(--space-5); }
    .tile { padding: var(--space-5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .tile span { display: block; color: var(--muted); font: 600 13px/18px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; }
    .tile strong { display: block; margin-top: var(--space-1); font: 700 28px/34px var(--font-display); text-transform: capitalize; overflow-wrap: anywhere; }

    .section-title { margin: var(--space-6) 0 var(--space-3); font: 600 22px/28px var(--font-display); }
    .health-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: var(--space-3); }
    .health-provider-card { padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
    .health-provider-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
    .health-provider-name { min-width: 0; overflow: hidden; color: var(--text); font-size: 16px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .health-state { display: inline-flex; align-items: center; gap: 6px; flex: none; color: var(--text); font-size: 13px; font-weight: 600; text-transform: capitalize; }
    .health-state::before { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); content: ""; }
    .health-state.is-healthy::before, .health-state.is-cached::before { background: var(--ok); }
    .health-state.is-empty::before, .health-state.is-degraded::before { background: var(--warn); }
    .health-state.is-error::before { background: var(--accent-fill); }
    .health-provider-meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin-top: var(--space-2); color: var(--muted); font-size: 14px; }
    .health-note { margin: var(--space-2) 0 0; color: var(--warn); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
  </style>
</head>

    <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch theme">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
  </header>

  <div class="layout">
    <main class="content" id="providerHealthPanel">
      <section class="page-head" aria-labelledby="status-h">
        <div>
          <p class="eyebrow">System</p>
          <h1 id="status-h">Provider status</h1>
          <p class="lede">Catalog sync health for this instance. Refreshes every 30 seconds while this page is open.</p>
        </div>
        <div class="head-tools">
          <span class="updated" id="providerHealthUpdated" aria-live="polite"></span>
          <button type="button" class="btn" id="refreshProviderHealth">Refresh</button>
        </div>
      </section>

      <div class="tiles" id="providerHealthSummary" aria-live="polite"></div>

      <h2 class="section-title" id="providers-h">Providers</h2>
      <div class="health-list" id="providerHealthList" aria-labelledby="providers-h">
        <div class="state-msg">Loading provider status...</div>
      </div>
    </main>
  </div>

  <script>
    const providerHealthPanel = document.getElementById('providerHealthPanel');
    const providerHealthSummary = document.getElementById('providerHealthSummary');
    const providerHealthList = document.getElementById('providerHealthList');
    const providerHealthUpdated = document.getElementById('providerHealthUpdated');
    const refreshProviderHealth = document.getElementById('refreshProviderHealth');
    let loaded = false;

    function formatHealthAge(value) {
      if (!value) return 'Never';
      const time = new Date(value).getTime();
      if (!Number.isFinite(time)) return 'Unknown';
      const seconds = Math.max(0, Math.round((Date.now() - time) / 1000));
      if (seconds < 60) return seconds + 's ago';
      if (seconds < 3600) return Math.round(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.round(seconds / 3600) + 'h ago';
      return Math.round(seconds / 86400) + 'd ago';
    }

    function addHealthSummary(label, value) {
      const item = document.createElement('div');
      item.className = 'tile';
      const key = document.createElement('span');
      key.textContent = label;
      const result = document.createElement('strong');
      result.textContent = value;
      item.append(key, result);
      providerHealthSummary.appendChild(item);
    }

    function showMessage(text, isError) {
      providerHealthList.replaceChildren();
      const msg = document.createElement('div');
      msg.className = 'state-msg' + (isError ? ' is-error' : '');
      msg.textContent = text;
      providerHealthList.appendChild(msg);
    }

    function renderProviderHealth(data) {
      const providers = Array.isArray(data.providers) ? data.providers : [];
      const sync = data.sync || {};
      const breakers = data.circuitBreakers && typeof data.circuitBreakers === 'object'
        ? Object.values(data.circuitBreakers)
        : [];
      const openBreakers = breakers.filter((breaker) => breaker && breaker.state === 'open').length;

      providerHealthSummary.replaceChildren();
      addHealthSummary('Sync', sync.state || 'unknown');
      addHealthSummary('Catalog', Number.isFinite(sync.matchCount) ? String(sync.matchCount) : 'Not synced');
      addHealthSummary('Duration', Number.isFinite(sync.durationMs) ? (sync.durationMs / 1000).toFixed(1) + 's' : 'n/a');
      addHealthSummary('Open breakers', String(openBreakers));

      providerHealthList.replaceChildren();
      if (!providers.length) showMessage('No providers reported yet.', false);
      for (const provider of providers) {
        const card = document.createElement('div');
        card.className = 'health-provider-card';
        const head = document.createElement('div');
        head.className = 'health-provider-head';
        const name = document.createElement('span');
        name.className = 'health-provider-name';
        name.textContent = provider.name || provider.id || 'Unknown';
        const stateName = provider.state || 'unknown';
        const state = document.createElement('span');
        state.className = 'health-state is-' + stateName;
        state.textContent = stateName;
        head.append(name, state);

        const meta = document.createElement('div');
        meta.className = 'health-provider-meta';
        const fixtures = document.createElement('span');
        fixtures.textContent = Number.isFinite(provider.matchCount) ? provider.matchCount + ' fixtures' : 'No fixture data';
        const latency = document.createElement('span');
        latency.textContent = Number.isFinite(provider.durationMs) ? provider.durationMs + ' ms' : 'Not checked';
        const checked = document.createElement('span');
        checked.textContent = formatHealthAge(provider.lastAttemptAt);
        meta.append(fixtures, latency, checked);
        card.append(head, meta);

        const noteText = provider.error || provider.note ||
          (provider.carriedForwardCount > 0 ? provider.carriedForwardCount + ' fixtures carried forward' : '');
        if (noteText) {
          const note = document.createElement('p');
          note.className = 'health-note';
          note.textContent = noteText;
          card.appendChild(note);
        }
        providerHealthList.appendChild(card);
      }
      providerHealthUpdated.textContent = 'Updated ' + formatHealthAge(data.generatedAt);
    }

    async function loadProviderHealth() {
      refreshProviderHealth.disabled = true;
      try {
        const response = await fetch('/api/provider-health', { cache: 'no-store' });
        if (!response.ok) {
          if (!loaded) showMessage('Provider status is not available from this server (HTTP ' + response.status + ').', true);
          return;
        }
        renderProviderHealth(await response.json());
        loaded = true;
      } catch (_) {
        if (loaded) providerHealthUpdated.textContent = 'Refresh failed';
        else showMessage('Could not reach the server. Check that it is running.', true);
      } finally {
        refreshProviderHealth.disabled = false;
      }
    }

    refreshProviderHealth.addEventListener('click', loadProviderHealth);
    loadProviderHealth();
    setInterval(() => {
      if (!document.hidden) loadProviderHealth();
    }, 30000);

    (function () {
      var b = document.getElementById('themeToggle');
      if (!b) return;
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var root = document.documentElement;
      function eff() { return root.getAttribute('data-theme') || (mq.matches ? 'light' : 'dark'); }
      function paint() {
        var light = eff() === 'light';
        b.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
        b.querySelector('.ico-sun').toggleAttribute('hidden', light);
        b.querySelector('.ico-moon').toggleAttribute('hidden', !light);
      }
      b.addEventListener('click', function () {
        var next = eff() === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('nuvio-theme', next); } catch (e) {}
        paint();
      });
      if (mq.addEventListener) mq.addEventListener('change', paint);
      paint();
    })();
  </script>
</body>
